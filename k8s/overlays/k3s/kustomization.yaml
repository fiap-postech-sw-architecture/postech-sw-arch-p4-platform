# Overlay de um cluster persistente com k3s: o alvo opcional do deploy remoto,
# desligado no estado entregue (docs/operacao/nuvem-opcional.md, com a receita
# de uma VM da Azure). Nenhum cluster da fase usa este overlay.
#
# Pressupoe o k3s instalado com --disable traefik: o Service kong-proxy fica
# LoadBalancer (como no base) e o ServiceLB do k3s publica as portas 80/443
# da VM direto no Kong.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Prometheus com 15 dias de historico num PVC (local-path), no lugar do
# emptyDir: o painel de volume diario de OS e as evidencias pedem dias de dados.
components:
  - ../../componentes/prometheus-pvc

patches:
  # StorageClass do k3s (local-path), mais disco e mais memoria reservada
  # (request) para o broker, que aqui fica de pe por dias. O limite (1Gi) e o
  # vm_memory_high_watermark do rabbitmq.conf continuam os do base.
  - target:
      kind: StatefulSet
      name: rabbitmq
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 250m
          memory: 512Mi
  # Mais memoria para o Prometheus, que aqui fica de pe por dias com 15 dias de
  # historico (a retencao e o PVC vem do componente acima).
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
