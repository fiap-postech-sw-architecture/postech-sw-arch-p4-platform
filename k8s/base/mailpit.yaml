# Mailpit: SMTP de demonstracao (porta 1025, interna ao cluster) com caixa de
# entrada web (8025, via port-forward). Recebe as notificacoes que o OS
# Service manda ao cliente. Mesma imagem do compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      # A imagem nao define usuario (rodaria como root): nobody aqui.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          # O banco SQLite das mensagens fica em /tmp (emptyDir, raiz somente
          # leitura); some com o pod, como a caixa de entrada de demonstracao.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
