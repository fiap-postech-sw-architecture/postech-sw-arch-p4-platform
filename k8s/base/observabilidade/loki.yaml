# Loki single-binary (veio do k8s/loki.yaml da fase 3): recebe os logs JSON
# dos pods via Promtail e atende o Grafana (datasource loki). Armazenamento
# em emptyDir: os logs somem com o pod, aceitavel no cluster de demonstracao;
# producao usaria PVC ou object storage. Configuracao em config/loki.yaml
# (configMapGenerator do k8s/base).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # Uid 10001 da imagem; o fsGroup libera escrita em /loki.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: storage
              mountPath: /loki
          # /ready so responde 200 depois que o ring do ingester fica ativo
          # (uns 15s); a liveness olha so se o processo HTTP responde.
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
        # Teto de disco no no (que guarda tambem os volumes do broker e dos
        # bancos); a retencao de 7 dias do loki.yaml fica bem abaixo dele.
        - name: storage
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
