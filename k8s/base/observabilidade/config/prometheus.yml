global:
  scrape_interval: 15s
scrape_configs:
  - job_name: pods-anotados
    # Contrato do ADR-043 (README, "Endereços e variáveis"): pods anotados dos
    # namespaces pytstop-* (plataforma e os tres servicos); fora deles, nem
    # pod anotado entra.
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: pytstop-.+
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # Pod de Job concluido continua listado ate ser apagado; raspar
      # ele so geraria up=0 e alerta falso.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      # O discovery gera um alvo por porta declarada; fica so o da porta
      # anotada.
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        target_label: __meta_kubernetes_pod_annotation_prometheus_io_port
        action: keepequal
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      # job = label app do pod (os-service-api, rabbitmq, kong...), que e
      # o nome que aparece nos paineis e alertas.
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: (.+)
        target_label: job
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      # processo = label do pod (api, relay, consumidor, prazos): separa os
      # Deployments de um mesmo servico nos paineis de saga e mensageria.
      - source_labels: [__meta_kubernetes_pod_label_processo]
        target_label: processo
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  # Estado dos objetos (limites de recursos dos pods) - kube-state-metrics.yaml.
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080
  # Uso real de CPU/memoria por container (cAdvisor via kubelet). TLS sem
  # verificacao porque o certificado do kubelet no kind/k3s e autoassinado
  # e nao cobre o IP do no.
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
