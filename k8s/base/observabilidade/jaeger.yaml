# Jaeger all-in-one (veio do k8s/jaeger.yaml da fase 3, agora com tag fixa):
# recebe OTLP direto do SDK de cada servico, sem Collector no meio.
#   OTLP gRPC: jaeger:4317 (OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317)
#   OTLP HTTP: jaeger:4318
#   UI e API de consulta (datasource do Grafana): jaeger:16686
# Traces em memoria, limitados por MEMORY_MAX_TRACES para nao crescer ate o
# OOMKill num cluster que fica de pe dias (k3s). O teto sai da conta com o trace
# real, medida no kind com os tres servicos: o trace de uma saga chega a 339 spans, e
# 1929 traces (14 mil spans) depois de tres execucoes do E2E ocupavam 181Mi, perto de
# 12 KB por span (181Mi menos os 11Mi do Jaeger ocioso). Uma saga completa pesa uns
# 4 MB, e umas 110 enchem o limite de 512Mi; com 5000 traces e trafego so de saga ele estouraria. O teto
# de 250 vale para o mix medido, em que so 1 trace em cada 66 e de saga (29 em 1929):
# uns 4 sagas e o resto de trafego pequeno ocupam cerca de 40Mi. Se o trafego for so
# de saga, o limite de memoria e a rede de seguranca: estoura, o pod reinicia e os
# traces vao embora. O Jaeger e para a demonstracao: gere o trace e capture logo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      # Uid 10001 da imagem; traces so em memoria.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: "250"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: admin
              containerPort: 14269
          # Porta admin: / responde "Server available" quando o coletor e a
          # consulta estao no ar.
          livenessProbe:
            httpGet:
              path: /
              port: admin
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: admin
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
