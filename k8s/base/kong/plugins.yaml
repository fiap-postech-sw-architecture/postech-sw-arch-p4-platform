# Plugins do Kong compartilhados pelos tres servicos (ADR-038). Sao
# KongClusterPlugin (escopo de cluster) porque os Ingress ficam nos namespaces
# dos servicos e um KongPlugin so pode ser usado por Ingress do proprio
# namespace. O controller so le KongClusterPlugin com a anotacao da
# IngressClass.
#
# Globais (label global: "true"), valem para toda rota sem anotacao:
# correlation-id, prometheus, bloqueia-barra-codificada e rate-limiting-global.
# Os demais entram por anotacao no Ingress (konghq.com/plugins: <nome>); o
# rate-limiting da rota substitui o global e conta num balde proprio da rota.
# Tabela rota -> plugin e exemplos completos de Ingress no README.
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: correlation-id
  annotations:
    kubernetes.io/ingress.class: kong
  labels:
    global: "true"
plugin: correlation-id
config:
  header_name: X-Request-ID
  # uuid puro (sem o sufixo #contador do gerador uuid#counter): o middleware
  # dos servicos so aceita X-Request-ID externo em [A-Za-z0-9._=-]{1,128} e
  # trocaria um id com "#" por outro, quebrando a correlacao gateway -> API.
  generator: uuid
  # Devolve o id na resposta: o cliente consegue citar o request_id dos logs.
  echo_downstream: true
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: prometheus
  annotations:
    kubernetes.io/ingress.class: kong
  labels:
    global: "true"
plugin: prometheus
config:
  # No Kong 3.x essas familias vem desligadas; sem elas o /metrics do status
  # listener (porta 8100) nao traz contagem por status nem latencia, que sao
  # o que o dashboard e o alerta de 5xx usam.
  status_code_metrics: true
  latency_metrics: true
---
# Caminho com barra codificada (%2F) ou barra invertida codificada (%5C) nunca
# chega a um servico. O Kong casa as rotas por segmento e nao conta %2F como /,
# entao /os/api/v1/admin%2Foutbox escaparia do Ingress fora-da-borda e
# /os/api/v1/autenticacao%2Flogin, do limite do login, e o servico (uvicorn)
# decodifica o %2F e atende /admin/outbox. O %5C o uvicorn deixa como barra
# invertida literal; sai junto por precaucao, com qualquer outro servidor que o
# tratasse como separador. 404 igual ao de rota inexistente. O pre-function tem
# a maior prioridade: responde antes dos plugins de rate limit, e esse 404 nao
# gasta balde nenhum. So o caminho conta: a query string (get_raw_path nao a
# inclui) pode levar %2F.
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: bloqueia-barra-codificada
  annotations:
    kubernetes.io/ingress.class: kong
  labels:
    global: "true"
plugin: pre-function
config:
  access:
    - |-
      local caminho = kong.request.get_raw_path():lower()
      if caminho:find("%2f", 1, true) or caminho:find("%5c", 1, true) then
        return kong.response.exit(404, { message = "no Route matched with those values" })
      end
---
# /metrics e /api/v1/admin/* nunca saem pela borda: o Ingress do servico
# casa esses caminhos (o mais longo vence) e anota este plugin. 404 igual ao
# de rota inexistente, para nao confirmar que o caminho existe.
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: fora-da-borda
  annotations:
    kubernetes.io/ingress.class: kong
plugin: request-termination
config:
  status_code: 404
  message: no Route matched with those values
---
# Rate limiting por IP do cliente, contador local na memoria do pod do Kong
# (com mais de uma replica do gateway cada uma conta a sua parte; a policy
# redis resolveria). Limites do ADR-038; o overlay kind os multiplica por 10.
# O IP real chega pelo externalTrafficPolicy Local do kong-proxy (values.yaml
# e README).
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-global
  annotations:
    kubernetes.io/ingress.class: kong
  labels:
    global: "true"
plugin: rate-limiting
config:
  # Demais rotas: o limite global da API da fase 3.
  minute: 60
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-login
  annotations:
    kubernetes.io/ingress.class: kong
plugin: rate-limiting
config:
  # POST /api/v1/autenticacao/login (fase 3).
  minute: 5
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-sessao
  annotations:
    kubernetes.io/ingress.class: kong
plugin: rate-limiting
config:
  # POST /api/v1/autenticacao/refresh e /logout (fase 3).
  minute: 10
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-publico
  annotations:
    kubernetes.io/ingress.class: kong
plugin: rate-limiting
config:
  # Rotas sem JWT: acompanhamento, link de decisao e simulador do checkout.
  minute: 10
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-jwks
  annotations:
    kubernetes.io/ingress.class: kong
plugin: rate-limiting
config:
  # GET /.well-known/jwks.json: quem valida guarda a chave em cache.
  minute: 60
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: rate-limiting-webhook
  annotations:
    kubernetes.io/ingress.class: kong
plugin: rate-limiting
config:
  # POST /api/v1/webhooks/mercadopago: folga para rajadas e reenvios do
  # provedor, num balde que nao divide limite com o resto.
  minute: 120
  policy: local
  limit_by: ip
