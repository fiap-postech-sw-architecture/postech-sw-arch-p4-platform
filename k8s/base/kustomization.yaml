# Infraestrutura compartilhada da fase 4 no namespace pytstop-plataforma:
# RabbitMQ, Kong (gateway e IngressClass), Mailpit e a stack de
# observabilidade. Cada servico tem namespace proprio (pytstop-os,
# pytstop-billing, pytstop-execucao), criado pelo repositorio do servico junto
# com os seus manifests.
#
# Nao aplique este diretorio direto: use um overlay (kind ou k3s) pelo
# `make deploy`, que aplica as CRDs do Kong antes do resto.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pytstop-plataforma

# Rotulo que o `make deploy` usa para esperar so os rollouts da plataforma.
labels:
  - pairs:
      app.kubernetes.io/part-of: pytstop-plataforma

resources:
  - namespace.yaml
  - rabbitmq/rabbitmq.yaml
  - kong/crds.yaml
  - kong/kong.yaml
  - kong/plugins.yaml
  - mailpit.yaml
  - observabilidade/prometheus.yaml
  - observabilidade/grafana.yaml
  - observabilidade/loki.yaml
  - observabilidade/promtail.yaml
  - observabilidade/jaeger.yaml
  - observabilidade/kube-state-metrics.yaml
  # Datasources, alertas e dashboards do Grafana (compartilhados com o compose).
  - ../../observabilidade

# Topologia, configuracao e script de usuarios do RabbitMQ; o compose monta
# os mesmos arquivos.
configMapGenerator:
  - name: rabbitmq-config
    files:
      - rabbitmq/definitions.json
      - rabbitmq/rabbitmq.conf
    options:
      labels:
        app: rabbitmq
  - name: rabbitmq-scripts
    files:
      - rabbitmq/criar-usuarios.sh
      - rabbitmq/permissoes.json
    options:
      labels:
        app: rabbitmq-usuarios
