# Varredura semanal de todas as refs (`--all`): o job gitleaks do CI varre so o
# historico do commit testado, entao branch sem PR e tag ficariam de fora.
name: gitleaks-semanal

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-todas-as-refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Busca todas as branches e tags
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' && git fetch --tags origin
      - name: Instala gitleaks (versao e sha256 fixados)
        run: |
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: gitleaks (todas as refs, regras do .gitleaks.toml)
        run: gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner --verbose
