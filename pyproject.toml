[project]
name = "pytstop-plataforma"
version = "0.1.0"
description = "Contratos de mensageria e testes da plataforma da fase 4 do PytStop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# So ferramentas de teste e qualidade: o repositorio nao tem codigo de
# producao em Python, so os testes de contrato, o E2E da saga e a prova do
# retry no broker (scripts/prova_retry.py, que o make smoke executa).
[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    # format-nongpl liga a checagem de date-time e uri do FormatChecker; sem
    # ela o jsonschema ignora "format" calado.
    "jsonschema[format-nongpl]>=4.26,<5",
    "mypy>=2.4,<3",
    # Mesmo cliente AMQP dos servicos: a prova publica como o consumidor.
    "pika>=1.4.4,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pyyaml>=6.0.3,<7",
    "referencing>=0.37,<0.38",
    "ruff>=0.16.10,<0.17",
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0.12",
]
e2e = [
    "httpx>=0.28,<1",
    "pytest-bdd>=8.1,<9",
]

[tool.uv]
package = false
# O E2E (pytest-bdd, httpx) entra no ambiente padrao: o mypy do make lint
# confere o e2e/ e os testes do codigo auxiliar dele importam o httpx. O
# make e2e pede o grupo mesmo assim.
default-groups = ["dev", "e2e"]

[tool.pytest.ini_options]
testpaths = ["contratos/tests", "tests"]
# O codigo auxiliar do E2E (e2e/apoio) e testado daqui, sem cluster.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--cov", "--cov-report=term-missing"]

# Mede so o codigo de teste: o repositorio nao tem Python de producao. Quem
# protege os schemas sao os negativos gerados dos exemplos (test_contratos.py)
# e a observabilidade, o teste de consistencia (tests/). Do E2E entra o codigo
# auxiliar (e2e/apoio); o conftest, os steps e o cliente dos servicos so rodam
# contra o cluster (make e2e).
[tool.coverage.run]
branch = true
source = ["contratos", "tests", "e2e/apoio"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
# Mesmo alvo da fase 3: com py314 o formatter tira os parenteses de
# `except (A, B):` (PEP 758), que parte do tooling ainda nao le.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "RUF", "S", "PT",
    "PTH", "RET", "FA", "ISC", "TID",
]

[tool.ruff.lint.per-file-ignores]
"contratos/tests/**" = ["S101"]
"tests/**" = ["S101"]
"e2e/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["contratos/tests", "tests", "scripts", "e2e"]

# pika nao publica tipos (sem py.typed nem stubs mantidos).
[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

[tool.bandit]
# assert e o mecanismo do pytest; a prova do retry em scripts/ nao usa assert
# (o S101 do ruff pega se usar).
skips = ["B101"]
