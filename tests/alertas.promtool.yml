  # -------------------------------- no instante exato do for, janelas e limiares
  # Casos que separam a regra de uma versao dela com o for, a janela do rate ou o
  # limiar um pouco diferentes: cada um avalia no minuto exato em que a regra
  # certa dispara (e um minuto antes, quieta), ou usa um valor entre o limiar certo
  # e o errado.
  - name: pytstop-fila-sem-consumidor, 0 consumidores dispara no minuto exato do for (2 min) e nao um minuto antes
    interval: 1m
    input_series:
      - series: rabbitmq_queue_consumers{queue="os.eventos"}
        values: 0x10
      - series: rabbitmq_queue_consumers{queue="billing.comandos"}
        values: 1x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-fila-sem-consumidor
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-fila-sem-consumidor
        exp_alerts:
          - exp_labels: {queue: os.eventos}
  - name: servico fora do ar, up 0 dispara no minuto exato do for (2 min) e nao um minuto antes
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 0x10
      - series: up{job="billing-service-api", pod="billing-api-1"}
        values: 0x10
      - series: up{job="execution-service-api", pod="exec-api-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-os-service-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-os-service-fora
        exp_alerts:
          - exp_labels: {}
      - eval_time: 1m
        alertname: pytstop-billing-service-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-billing-service-fora
        exp_alerts:
          - exp_labels: {}
      - eval_time: 1m
        alertname: pytstop-execution-service-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-execution-service-fora
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-webhook-assinatura-invalida, mais 1 por minuto dispara no minuto exato (1 min de dado e 5 min de for) e nao antes
    interval: 1m
    input_series:
      - series: pytstop_webhook_assinatura_invalida_total{pod="billing-api-1"}
        values: 0+1x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-webhook-assinatura-invalida
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-webhook-assinatura-invalida
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-servico-5xx, 2% de 5xx dispara no minuto exato (1 min de dado e 5 min de for) e nao antes
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", status="200"}
        values: 0+98x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="503"}
        values: 0+2x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-servico-5xx
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-servico-5xx
        exp_alerts:
          - exp_labels: {job: os-service-api}
  - name: pytstop-servico-5xx, 1,2% de 5xx dispara (entre o limiar de 1% e um de 1,5%)
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", status="200"}
        values: 0+247x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="503"}
        values: 0+3x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-servico-5xx
        exp_alerts:
          - exp_labels: {job: os-service-api}
  - name: pytstop-servico-5xx, rajada de 5 min de 5xx ainda conta 3 min depois (a janela do rate e de 5 min)
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", status="200"}
        values: 0+100x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="503"}
        values: 0 10 20 30 40 50 50 50 50 50 50 50 50 50 50 50 50 50 50 50
    alert_rule_test:
      # Com a janela de 2 min o 5xx ja teria saido da conta em 6 min e a regra nunca
      # teria passado dos 5 min do for.
      - eval_time: 7m
        alertname: pytstop-servico-5xx
        exp_alerts:
          - exp_labels: {job: os-service-api}
      - eval_time: 10m
        alertname: pytstop-servico-5xx
        exp_alerts: []
  - name: pytstop-gateway-5xx, rajada de 5 min de 5xx no Kong ainda conta 3 min depois (a janela do rate e de 5 min)
    interval: 1m
    input_series:
      - series: kong_http_requests_total{code="200", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+100x20
      - series: kong_http_requests_total{code="500", service="pytstop-os.os-service-borda-api.8000"}
        values: 0 10 20 30 40 50 50 50 50 50 50 50 50 50 50 50 50 50 50 50
    alert_rule_test:
      - eval_time: 7m
        alertname: pytstop-gateway-5xx
        exp_alerts:
          - exp_labels: {}
      - eval_time: 10m
        alertname: pytstop-gateway-5xx
        exp_alerts: []
  - name: pytstop-gateway-5xx, 5xx do Kong dispara no minuto exato (1 min de dado e 5 min de for) e nao antes
    interval: 1m
    input_series:
      - series: kong_http_requests_total{code="200", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+98x20
      - series: kong_http_requests_total{code="500", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+2x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-gateway-5xx
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-gateway-5xx
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-compensacoes-acima-do-normal, 0,55 compensacao por saga iniciada dispara (entre o limiar de 0,5 e um de 0,6)
    interval: 1m
    input_series:
      - series: pytstop_saga_compensacoes_total{pod="os-api-1"}
        values: 0+0.55x70
      - series: pytstop_saga_iniciadas_total{pod="os-api-1"}
        values: 0+1x70
    alert_rule_test:
      - eval_time: 65m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-cpu-pod-alta, 82% do limite por 10 min dispara (entre o limiar de 80% e um de 85%)
    interval: 1m
    input_series:
      - series: container_cpu_usage_seconds_total{namespace="pytstop-os", pod="os-api-1", container="api"}
        values: 0+49.2x30
      - series: kube_pod_container_resource_limits{namespace="pytstop-os", pod="os-api-1", container="api", resource="cpu"}
        values: 1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: pytstop-cpu-pod-alta
        exp_alerts:
          - exp_labels: {namespace: pytstop-os, pod: os-api-1}

  # ---------------------------------------- consultas de painel (promql_expr_test)
  # Serviços 2 e 11: a taxa de sucesso é a razão das respostas sem 5xx sobre todas,
  # e o painel de erro é 1 menos ela. A série com status 5xx só nasce no primeiro
  # 5xx; a razão do 5xx sobre o total (e o 1 menos ela) ficava vazia numa API sadia.
  # As sondas (/metrics e /api/v1/saude*) ficam de fora dos painéis de requisição.
  - name: paineis Servicos 2 e 11, API so com 200 e 404 (nenhum 5xx ainda) mostram 100% e 0, e as sondas nao contam
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/ordens-de-servico", status="200"}
        values: 0+60x10
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/ordens-de-servico/{ordem_id}", status="404"}
        values: 0+6x10
      - series: http_request_duration_seconds_count{job="billing-service-api", method="GET", rota="/api/v1/orcamentos", status="200"}
        values: 0+30x10
      # So sondas: sem requisicao de cliente o painel nao tem amostra, em vez de 100%.
      - series: http_request_duration_seconds_count{job="execution-service-api", method="GET", rota="/api/v1/saude", status="200"}
        values: 0+6x10
      - series: http_request_duration_seconds_count{job="execution-service-api", method="GET", rota="/metrics", status="200"}
        values: 0+4x10
    promql_expr_test:
      - expr: sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*", status!~"5.."}[5m])) / sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{job="os-service-api"}'
            value: 1
          - labels: '{job="billing-service-api"}'
            value: 1
      - expr: 1 - (sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*", status!~"5.."}[5m])) / sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m])))
        eval_time: 10m
        exp_samples:
          - labels: '{job="os-service-api"}'
            value: 0
          - labels: '{job="billing-service-api"}'
            value: 0
  - name: paineis Servicos 2 e 11, API com 10 respostas 503 a cada 100 de sucesso, e o 503 do /pronto nao conta
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/ordens-de-servico", status="200"}
        values: 0+100x10
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/ordens-de-servico", status="503"}
        values: 0+10x10
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/saude/pronto", status="503"}
        values: 0+50x10
      - series: http_request_duration_seconds_count{job="billing-service-api", method="GET", rota="/api/v1/orcamentos", status="200"}
        values: 0+30x10
    promql_expr_test:
      - expr: sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*", status!~"5.."}[5m])) / sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{job="os-service-api"}'
            value: 0.9090909090909091
          - labels: '{job="billing-service-api"}'
            value: 1
      - expr: 1 - (sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*", status!~"5.."}[5m])) / sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m])))
        eval_time: 10m
        exp_samples:
          - labels: '{job="os-service-api"}'
            value: 0.09090909090909094
          - labels: '{job="billing-service-api"}'
            value: 0
  # Serviços 1: so requisicao de cliente conta; o scrape (/metrics) fica de fora nos tres
  # servicos, o OS inclusive, que registra o /metrics com rota de template.
  - name: painel Servicos 1, so requisicao de cliente conta e o scrape fica de fora nos tres servicos
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="billing-service-api", method="GET", rota="/api/v1/orcamentos", status="200"}
        values: 0+30x10
      - series: http_request_duration_seconds_count{job="billing-service-api", method="GET", rota="/metrics", status="200"}
        values: 0+4x10
      - series: http_request_duration_seconds_count{job="billing-service-api", method="GET", rota="/api/v1/saude", status="200"}
        values: 0+6x10
      - series: http_request_duration_seconds_count{job="execution-service-api", method="GET", rota="/api/v1/saude/pronto", status="503"}
        values: 0+10x10
      - series: http_request_duration_seconds_count{job="execution-service-api", method="GET", rota="/metrics", status="200"}
        values: 0+4x10
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/api/v1/ordens-de-servico", status="200"}
        values: 0+4x10
      - series: http_request_duration_seconds_count{job="os-service-api", method="GET", rota="/metrics", status="200"}
        values: 0+4x10
    promql_expr_test:
      - expr: sum by (job) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m]))
        eval_time: 10m
        exp_samples:
          - labels: '{job="billing-service-api"}'
            value: 0.5
          - labels: '{job="os-service-api"}'
            value: 0.06666666666666667
  # Serviços 3: o p95 vem so das requisicoes de cliente; as sondas lentas (/metrics e
  # /api/v1/saude/pronto) levariam o p95 do job de 0,2425 a 0,925 s.
  - name: painel Servicos 3, o p95 vem so das requisicoes de cliente e as sondas lentas ficam de fora
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.25"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="+Inf"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="0.25"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="+Inf"}
        values: 0+60x20
    promql_expr_test:
      - expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket{rota!~"/metrics|/api/v1/saude.*"}[5m])))
        eval_time: 15m
        exp_samples:
          - labels: '{job="os-service-api"}'
            value: 0.2425
  # Serviços 4: so a rota com requisicao de cliente nos ultimos 5 min entra. A rota
  # que parou de receber (contadores constantes) daria NaN, e a sonda lenta
  # (/metrics a ~1 s) apareceria no topo.
  - name: painel Servicos 4, rota parada nao vira NaN e a sonda lenta fica de fora
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.25"}
        values: 0+50x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="+Inf"}
        values: 0+50x20
      - series: http_request_duration_seconds_count{job="os-service-api", rota="/api/v1/ordens-de-servico"}
        values: 0+50x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", rota="/api/v1/orcamentos", le="0.1"}
        values: 100x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", rota="/api/v1/orcamentos", le="0.25"}
        values: 100x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", rota="/api/v1/orcamentos", le="+Inf"}
        values: 100x20
      - series: http_request_duration_seconds_count{job="billing-service-api", rota="/api/v1/orcamentos"}
        values: 100x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="0.25"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="1"}
        values: 0+10x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="+Inf"}
        values: 0+10x20
      - series: http_request_duration_seconds_count{job="os-service-api", rota="/metrics"}
        values: 0+10x20
    promql_expr_test:
      - expr: topk(10, histogram_quantile(0.95, sum by (le, job, rota) (rate(http_request_duration_seconds_bucket{rota!~"/metrics|/api/v1/saude.*"}[5m]))) and on (job, rota) (sum by (job, rota) (rate(http_request_duration_seconds_count{rota!~"/metrics|/api/v1/saude.*"}[5m])) > 0))
        eval_time: 15m
        exp_samples:
          - labels: '{job="os-service-api", rota="/api/v1/ordens-de-servico"}'
            value: 0.2425
  # Orcamentos 3: o p90 so aparece com 10 decisoes ou mais no periodo; com menos ele so
  # diria em que balde as decisoes cairam. O $__range do teste e 1h.
  - name: painel Orcamentos 3, o p90 aparece com 10 decisoes e some com 9
    interval: 1m
    input_series:
      # aprovado: 10 decisoes na hora, 4 de ate 1 s e 6 de 1 a 2 s.
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="aprovado", le="1"}
        values: 0x30 4x30
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="aprovado", le="2"}
        values: 0x30 10x30
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="aprovado", le="+Inf"}
        values: 0x30 10x30
      - series: pytstop_orcamentos_tempo_decisao_segundos_count{decisao="aprovado"}
        values: 0x30 10x30
      # recusado: 9 decisoes, todas de 1 a 2 s.
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="recusado", le="1"}
        values: 0x61
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="recusado", le="2"}
        values: 0x30 9x30
      - series: pytstop_orcamentos_tempo_decisao_segundos_bucket{decisao="recusado", le="+Inf"}
        values: 0x30 9x30
      - series: pytstop_orcamentos_tempo_decisao_segundos_count{decisao="recusado"}
        values: 0x30 9x30
    promql_expr_test:
      - expr: histogram_quantile(0.9, sum by (le, decisao) (increase(pytstop_orcamentos_tempo_decisao_segundos_bucket[1h]))) and on (decisao) (sum by (decisao) (increase(pytstop_orcamentos_tempo_decisao_segundos_count[1h])) >= 10)
        eval_time: 60m
        exp_samples:
          - labels: '{decisao="aprovado"}'
            value: 1.8333333333333335
