        values: 0+2x20
      - series: http_request_duration_seconds_count{job="billing-service-api", status="200", rota="/api/v1/x", method="GET"}
        values: 0+98x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="500", rota="/api/v1/x", method="GET"}
        values: 0+0.5x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="200", rota="/api/v1/x", method="GET"}
        values: 0+99.5x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-servico-5xx
        exp_alerts: []
      - eval_time: 7m
        alertname: pytstop-servico-5xx
        exp_alerts:
          - exp_labels: {job: billing-service-api}
  - name: pytstop-servico-5xx, 0,5% e 1% exato de 5xx nao disparam, e 4xx nao conta
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_count{job="os-service-api", status="500", rota="/api/v1/x", method="GET"}
        values: 0+0.5x20
      - series: http_request_duration_seconds_count{job="os-service-api", status="200", rota="/api/v1/x", method="GET"}
        values: 0+99.5x20
      - series: http_request_duration_seconds_count{job="execution-service-api", status="500", rota="/api/v1/x", method="GET"}
        values: 0+1x20
      - series: http_request_duration_seconds_count{job="execution-service-api", status="200", rota="/api/v1/x", method="GET"}
        values: 0+99x20
      - series: http_request_duration_seconds_count{job="billing-service-api", status="404", rota="/api/v1/x", method="GET"}
        values: 0+50x20
      - series: http_request_duration_seconds_count{job="billing-service-api", status="200", rota="/api/v1/x", method="GET"}
        values: 0+50x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-servico-5xx
        exp_alerts: []

  # ------------------------------------------------------------- latencia p95
  # O limiar e 500 ms, fim de bucket (250 ms, 500 ms, 1 s): o histogram_quantile
  # interpola dentro do bucket, entao so passa de 0,5 se o p95 de verdade passou.
  - name: pytstop-latencia-p95, p95 na faixa de 500 ms a 1 s dispara so no job lento
    interval: 1m
    input_series:
      # Billing: toda observacao entre 500 ms e 1 s, p95 interpolado em 0,975 s.
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.25"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.5"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="+Inf"}
        values: 0+60x20
      # OS: toda observacao abaixo de 100 ms.
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.25"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.5"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-latencia-p95
        exp_alerts: []
      - eval_time: 7m
        alertname: pytstop-latencia-p95
        exp_alerts:
          - exp_labels: {job: billing-service-api}
  - name: pytstop-latencia-p95, todas as requisicoes em 260 ms (faixa de 250 a 500 ms) nao disparam
    interval: 1m
    input_series:
      # p95 de verdade: 260 ms. A estimativa por interpolacao na faixa e 0,4875 s,
      # abaixo do limiar de 0,5; com o limiar no meio da faixa (0,3) ela disparava.
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.25"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.5"}
        values: 0+100x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="1"}
        values: 0+100x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="+Inf"}
        values: 0+100x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-latencia-p95
        exp_alerts: []
  - name: pytstop-latencia-p95, 10% de requisicoes lentas puxam o p95 e a mediana continua rapida
    interval: 1m
    input_series:
      # 90% das observacoes abaixo de 100 ms e 10% entre 500 ms e 1 s: o p95 cai na
      # cauda lenta (0,75 s) e a mediana (p50) ficaria em 50 ms.
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.1"}
        values: 0+54x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.25"}
        values: 0+54x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.5"}
        values: 0+54x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 7m
        alertname: pytstop-latencia-p95
        exp_alerts:
          - exp_labels: {job: billing-service-api}
  - name: pytstop-latencia-p95, 7% de requisicoes lentas passam do limiar por pouco (p95 em 0,625 s) e disparam
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.1"}
        values: 0+56x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.25"}
        values: 0+56x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.5"}
        values: 0+56x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 7m
        alertname: pytstop-latencia-p95
        exp_alerts:
          - exp_labels: {job: billing-service-api}
  - name: pytstop-latencia-p95, p95 em 100 ms nao dispara
    interval: 1m
    input_series:
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="0.25"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-latencia-p95
        exp_alerts: []
  - name: pytstop-latencia-p95, sonda lenta (/metrics) nao puxa o p95 de quem atende rapido
    interval: 1m
    input_series:
      # Clientes: tudo abaixo de 100 ms. Scrape: tudo entre 500 ms e 1 s, no mesmo
      # volume. Contada, a sonda levaria o p95 do job a 0,975 s; fora, ele fica em 95 ms.
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.5"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="+Inf"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="0.1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="0.5"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/metrics", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-latencia-p95
        exp_alerts: []
  - name: pytstop-latencia-p95, sonda lenta do /api/v1/saude/pronto (banco fora, ate 2 s) nao puxa o p95
    interval: 1m
    input_series:
      # Clientes: tudo abaixo de 100 ms. /pronto com o banco fora: tudo acima de 1 s, no
      # mesmo volume. Contada, a sonda levaria o p95 do job a 1 s; fora, ele fica em 95 ms.
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="0.1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/ordens-de-servico", le="+Inf"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="0.1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="1"}
        values: 0x20
      - series: http_request_duration_seconds_bucket{job="os-service-api", rota="/api/v1/saude/pronto", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-latencia-p95
        exp_alerts: []
  - name: pytstop-latencia-p95, rajada lenta de 10 min ainda conta na janela de 5 min do rate e deixa de contar depois
    interval: 1m
    input_series:
      # Nos 10 primeiros minutos toda observacao fica entre 500 ms e 1 s; depois, abaixo
      # de 100 ms. A janela de 5 min ainda enxerga a rajada no minuto 14 e a esqueceu no
      # 16; uma janela de 2 min a esqueceria no 12, e uma de 10 min ainda a veria no 16.
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.1"}
        values: 0x10 60+60x9
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="0.5"}
        values: 0x10 60+60x9
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="1"}
        values: 0+60x20
      - series: http_request_duration_seconds_bucket{job="billing-service-api", le="+Inf"}
        values: 0+60x20
    alert_rule_test:
      - eval_time: 14m
        alertname: pytstop-latencia-p95
        exp_alerts:
          - exp_labels: {job: billing-service-api}
      - eval_time: 16m
        alertname: pytstop-latencia-p95
        exp_alerts: []

  # ---------------------------------------------------------- servico fora do ar
  - name: pytstop-os-service-fora, API do OS com up 0 por 3 min dispara e as outras nao interferem
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 0x10
      - series: up{job="billing-service-api", pod="billing-api-1"}
        values: 1x10
      - series: up{job="execution-service-api", pod="exec-api-1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-os-service-fora
        exp_alerts: []
