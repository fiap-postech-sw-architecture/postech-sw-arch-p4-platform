# Casos do promtool para as regras de observabilidade/grafana/alertas*.yaml
# (scripts/alertas-promtool.sh, make manifests; ADR-043). O script transforma
# cada regra do Grafana numa regra do Prometheus com `alert: <uid>`, a consulta A
# comparada com o limiar do threshold (`> X` ou `< X`) e o `for` da propria regra,
# e roda este arquivo contra elas. Os valores sao os de producao: o overlay kind
# troca so o "Outbox parada" (30 s e 1 minuto) e o promtool continua testando
# 300 s e 5 minutos.
#
# Toda regra tem ao menos um caso que dispara e um que nao dispara (o teste
# tests/test_observabilidade.py confere). Onde da, o caso do limiar usa o valor
# logo acima (dispara) e o valor igual (nao dispara), e o da janela avalia no
# minuto do `for` (dispara) e um minuto antes (nao dispara). "Sem dado" nao se
# prova aqui, porque a consulta sem serie nao gera alerta no promtool: a tabela
# do README e o smoke cobrem o noDataState.
rule_files: [regras.yml]
evaluation_interval: 1m
tests:
  # ---------------------------------------------------------------- DLQ
  - name: pytstop-dlq-com-mensagens, mensagem na DLQ dispara so na fila afetada
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages{queue="os.eventos.dlq"}
        values: 1x10
      - series: rabbitmq_queue_messages{queue="billing.comandos.dlq"}
        values: 0x10
      - series: rabbitmq_queue_messages{queue="os.eventos"}
        values: 50x10
    alert_rule_test:
      - eval_time: 30s
        alertname: pytstop-dlq-com-mensagens
        exp_alerts: []
      - eval_time: 1m
        alertname: pytstop-dlq-com-mensagens
        exp_alerts:
          - exp_labels: {queue: os.eventos.dlq}
  - name: pytstop-dlq-com-mensagens, fila de trabalho e de retry com mensagens e DLQ vazia nao disparam
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages{queue="os.eventos"}
        values: 50x10
      - series: rabbitmq_queue_messages{queue="os.eventos.retry.5s"}
        values: 7x10
      - series: rabbitmq_queue_messages{queue="os.eventos.dlq"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-dlq-com-mensagens
        exp_alerts: []

  # ------------------------------------------------------ alarme do broker
  - name: pytstop-rabbitmq-alarme, alarme de memoria dispara
    interval: 1m
    input_series:
      - series: rabbitmq_alarms_memory_used_watermark{job="rabbitmq"}
        values: 1x10
      - series: rabbitmq_alarms_free_disk_space_watermark{job="rabbitmq"}
        values: 0x10
    alert_rule_test:
      - eval_time: 30s
        alertname: pytstop-rabbitmq-alarme
        exp_alerts: []
      - eval_time: 1m
        alertname: pytstop-rabbitmq-alarme
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-rabbitmq-alarme, alarme de disco dispara
    interval: 1m
    input_series:
      - series: rabbitmq_alarms_memory_used_watermark{job="rabbitmq"}
        values: 0x10
      - series: rabbitmq_alarms_free_disk_space_watermark{job="rabbitmq"}
        values: 1x10
    alert_rule_test:
      - eval_time: 2m
        alertname: pytstop-rabbitmq-alarme
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-rabbitmq-alarme, sem alarme nao dispara
    interval: 1m
    input_series:
      - series: rabbitmq_alarms_memory_used_watermark{job="rabbitmq"}
        values: 0x10
      - series: rabbitmq_alarms_free_disk_space_watermark{job="rabbitmq"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-rabbitmq-alarme
        exp_alerts: []

  # --------------------------------------------------------- 5xx do gateway
  - name: pytstop-gateway-5xx, 2% de 5xx no Kong dispara
    interval: 1m
    input_series:
      - series: kong_http_requests_total{code="200", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+98x20
      - series: kong_http_requests_total{code="500", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+2x20
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-gateway-5xx
        exp_alerts: []
      - eval_time: 7m
        alertname: pytstop-gateway-5xx
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-gateway-5xx, 1% de 5xx exato nao dispara (acima de 0,01)
    interval: 1m
    input_series:
      - series: kong_http_requests_total{code="200", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+99x20
      - series: kong_http_requests_total{code="500", service="pytstop-os.os-service-borda-api.8000"}
        values: 0+1x20
    alert_rule_test:
      - eval_time: 12m
        alertname: pytstop-gateway-5xx
        exp_alerts: []

  # ------------------------------------------------------------ alvo fora
  - name: pytstop-alvo-fora, alvo com up 0 dispara so no job afetado
    interval: 1m
    input_series:
      - series: up{job="billing-service-api", pod="billing-api-1"}
        values: 0x10
      - series: up{job="rabbitmq", pod="rabbitmq-0"}
        values: 1x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-alvo-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-alvo-fora
        exp_alerts:
          - exp_labels: {job: billing-service-api}
  - name: pytstop-alvo-fora, todos de pe e cAdvisor fora nao disparam
    interval: 1m
    input_series:
      - series: up{job="billing-service-api", pod="billing-api-1"}
        values: 1x10
      - series: up{job="kubelet-cadvisor", instance="no-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-alvo-fora
        exp_alerts: []

  # --------------------------------------------------- RabbitMQ e Kong fora
  - name: pytstop-rabbitmq-fora, up 0 do broker dispara e o de outro job nao
    interval: 1m
    input_series:
      - series: up{job="rabbitmq"}
        values: 0x10
      - series: up{job="kong"}
        values: 1x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-rabbitmq-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-rabbitmq-fora
        exp_alerts:
          - exp_labels: {job: rabbitmq}
  - name: pytstop-rabbitmq-fora, broker de pe e Kong fora nao disparam esta regra
    interval: 1m
    input_series:
      - series: up{job="rabbitmq"}
        values: 1x10
      - series: up{job="kong"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-rabbitmq-fora
        exp_alerts: []
  - name: pytstop-kong-fora, up 0 do Kong dispara e o do broker nao
    interval: 1m
    input_series:
      - series: up{job="kong"}
        values: 0x10
      - series: up{job="rabbitmq"}
        values: 1x10
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-kong-fora
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-kong-fora
        exp_alerts:
          - exp_labels: {job: kong}
  - name: pytstop-kong-fora, Kong de pe e broker fora nao disparam esta regra
    interval: 1m
    input_series:
      - series: up{job="kong"}
        values: 1x10
      - series: up{job="rabbitmq"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-kong-fora
        exp_alerts: []

  # ------------------------------------------------------------- CPU do pod
  - name: pytstop-cpu-pod-alta, 90% do limite por 10 min dispara so no pod afetado
    interval: 1m
    input_series:
      - series: container_cpu_usage_seconds_total{namespace="pytstop-os", pod="os-api-1", container="api"}
        values: 0+54x30
      - series: kube_pod_container_resource_limits{namespace="pytstop-os", pod="os-api-1", container="api", resource="cpu"}
        values: 1x30
      - series: container_cpu_usage_seconds_total{namespace="pytstop-billing", pod="billing-api-1", container="api"}
        values: 0+12x30
      - series: kube_pod_container_resource_limits{namespace="pytstop-billing", pod="billing-api-1", container="api", resource="cpu"}
        values: 1x30
    alert_rule_test:
      - eval_time: 10m
        alertname: pytstop-cpu-pod-alta
        exp_alerts: []
      - eval_time: 20m
        alertname: pytstop-cpu-pod-alta
        exp_alerts:
          - exp_labels: {namespace: pytstop-os, pod: os-api-1}
  - name: pytstop-cpu-pod-alta, 50% do limite e pod fora dos namespaces pytstop nao disparam
    interval: 1m
    input_series:
      - series: container_cpu_usage_seconds_total{namespace="pytstop-os", pod="os-api-1", container="api"}
        values: 0+30x30
      - series: kube_pod_container_resource_limits{namespace="pytstop-os", pod="os-api-1", container="api", resource="cpu"}
        values: 1x30
      - series: container_cpu_usage_seconds_total{namespace="kube-system", pod="coredns-1", container="coredns"}
        values: 0+59x30
      - series: kube_pod_container_resource_limits{namespace="kube-system", pod="coredns-1", container="coredns", resource="cpu"}
        values: 1x30
    alert_rule_test:
      - eval_time: 25m
        alertname: pytstop-cpu-pod-alta
        exp_alerts: []

  # --------------------------------------------------------- saga parada
  - name: pytstop-saga-parada, prazo vencido ha 90 s, sem as series de falha_na_compensacao e do coletor
    interval: 1m
    input_series:
      # Cada replica da API repete o valor do coletor.
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-1"}
        values: 90x10
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-2"}
        values: 90x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, instancia em falha_na_compensacao, sem a serie do prazo
    interval: 1m
    input_series:
      - series: pytstop_saga_ativas{pod="os-api-1", etapa="falha_na_compensacao"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, coletor das sagas em 0 numa das duas replicas, com as outras series sadias
    interval: 1m
    input_series:
      - series: pytstop_saga_coletor_disponivel{pod="os-api-1"}
        values: 1x10
      - series: pytstop_saga_coletor_disponivel{pod="os-api-2"}
        values: 0x10
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, serie do coletor ausente com a API do OS Service de pe
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, serie do coletor ausente no compose, onde o job da API e os-service
    interval: 1m
    input_series:
      - series: up{job="os-service"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, coletor sadio, atraso de 45 s e instancias so em outras etapas
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 1x10
      - series: pytstop_saga_coletor_disponivel{pod="os-api-1"}
        values: 1x10
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-1"}
        values: 45x10
      - series: pytstop_saga_ativas{pod="os-api-1", etapa="compensando"}
        values: 2x10
      - series: pytstop_saga_ativas{pod="os-api-1", etapa="falha_na_compensacao"}
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts: []
  - name: pytstop-saga-parada, duas replicas a 40 s, soma acima de 60 s e maximo abaixo
    interval: 1m
    input_series:
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-1"}
        values: 40x10
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-2"}
        values: 40x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts: []
  - name: pytstop-saga-parada, duas replicas, uma a 90 s de atraso e a outra a 0 (o maximo decide)
    interval: 1m
    input_series:
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-1"}
        values: 90x10
      - series: pytstop_saga_prazo_vencido_segundos{pod="os-api-2"}
        values: 0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, duas replicas, uma com instancia em falha_na_compensacao e a outra sem
    interval: 1m
    input_series:
      - series: pytstop_saga_ativas{pod="os-api-1", etapa="falha_na_compensacao"}
        values: 1x10
      - series: pytstop_saga_ativas{pod="os-api-2", etapa="falha_na_compensacao"}
        values: 0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, coletor fora por 3 minutos e de volta, menos que a janela de 5 min
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 1x10
      - series: pytstop_saga_coletor_disponivel{pod="os-api-1"}
        values: 1 1 0 0 0 1 1 1 1 1 1
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 9m
        alertname: pytstop-saga-parada
        exp_alerts: []
  - name: pytstop-saga-parada, duas replicas da API, uma com up 0, sem a serie do coletor
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 1x10
      - series: up{job="os-service-api", pod="os-api-2"}
        values: 0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: pytstop-saga-parada
        exp_alerts: []
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-saga-parada, API com up 0 e sem a serie do coletor (quem acusa e o pytstop-alvo-fora)
    interval: 1m
    input_series:
      - series: up{job="os-service-api", pod="os-api-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts: []
  - name: pytstop-saga-parada, nenhuma serie da saga e nenhum alvo da API na descoberta (OS Service fora)
    interval: 1m
    input_series:
      # Relay e consumidor de pe nao contam: so a API exporta o coletor.
      - series: up{job="os-service-relay"}
        values: 1x10
      - series: up{job="rabbitmq"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: pytstop-saga-parada
        exp_alerts: []

  # ------------------------------------------------ compensacoes acima do normal
  - name: pytstop-compensacoes-acima-do-normal, 1 compensacao por minuto para cada saga iniciada dispara
    interval: 1m
    input_series:
      - series: pytstop_saga_compensacoes_total{pod="os-api-1"}
        values: 0+1x70
      - series: pytstop_saga_iniciadas_total{pod="os-api-1"}
        values: 0+1x70
    alert_rule_test:
      - eval_time: 20m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts: []
      - eval_time: 65m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts:
          - exp_labels: {}
  - name: pytstop-compensacoes-acima-do-normal, 0,2 compensacao por minuto contra 1 saga por minuto nao dispara
    interval: 1m
    input_series:
      - series: pytstop_saga_compensacoes_total{pod="os-api-1"}
        values: 0+0.2x70
      - series: pytstop_saga_iniciadas_total{pod="os-api-1"}
        values: 0+1x70
    alert_rule_test:
      - eval_time: 65m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts: []
  - name: pytstop-compensacoes-acima-do-normal, 3 compensacoes em 30 min sem saga iniciada nao disparam (denominador minimo de 10)
    interval: 1m
    input_series:
      - series: pytstop_saga_compensacoes_total{pod="os-api-1"}
        values: 0+0.1x70
      - series: pytstop_saga_iniciadas_total{pod="os-api-1"}
        values: 0x70
    alert_rule_test:
      - eval_time: 65m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts: []
  - name: pytstop-compensacoes-acima-do-normal, 9 compensacoes em 30 min sem saga iniciada disparam (9 sobre o denominador minimo de 10)
    interval: 1m
    input_series:
      - series: pytstop_saga_compensacoes_total{pod="os-api-1"}
        values: 0+0.3x70
      - series: pytstop_saga_iniciadas_total{pod="os-api-1"}
        values: 0x70
    alert_rule_test:
      - eval_time: 25m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts: []
      - eval_time: 65m
        alertname: pytstop-compensacoes-acima-do-normal
        exp_alerts:
          - exp_labels: {}

  # --------------------------------------------------------- circuito aberto
  - name: pytstop-circuito-aberto, disjuntor aberto dispara com os labels e o fechado nao
    interval: 1m
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-billing", dependencia="mercadopago", pod="billing-api-1"}
        values: 1x10
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-billing", dependencia="jwks", pod="billing-api-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 30s
        alertname: pytstop-circuito-aberto
        exp_alerts: []
      - eval_time: 1m
        alertname: pytstop-circuito-aberto
        exp_alerts:
          - exp_labels: {namespace: pytstop-billing, dependencia: mercadopago}
  - name: pytstop-circuito-aberto, todos fechados nao disparam
    interval: 1m
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-billing", dependencia="jwks", pod="billing-api-1"}
        values: 0x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-circuito-aberto
        exp_alerts: []
  - name: pytstop-circuito-aberto, meia-abertura da Execucao sem trafego (0,5) nao dispara
    interval: 1m
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-execucao", dependencia="billing", pod="exec-api-1"}
        values: 0.5x10
    alert_rule_test:
      - eval_time: 5m
        alertname: pytstop-circuito-aberto
        exp_alerts: []

  # A Execucao fica aberta so 30 s (1, por 30 s) e volta a 0,5 ate a proxima chamada:
  # com trafego raro o gauge faz 1 por 30 s, 0,5 por 60 s, e assim por diante.
  - name: pytstop-circuito-aberto, Execucao com trafego raro (1 por 30 s, 0,5 por 60 s) dispara
    interval: 15s
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-execucao", dependencia="billing", pod="exec-api-1"}
        values: "1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5 1 1 0.5 0.5 0.5 0.5"
    alert_rule_test:
      - eval_time: 30s
        alertname: pytstop-circuito-aberto
        exp_alerts: []
      - eval_time: 3m
        alertname: pytstop-circuito-aberto
        exp_alerts:
          - exp_labels: {namespace: pytstop-execucao, dependencia: billing}
  - name: pytstop-circuito-aberto, uma rajada em 1 e depois so meia-abertura solta em ate 2 min
    interval: 15s
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-execucao", dependencia="billing", pod="exec-api-1"}
        values: "1x8 0.5x40"
    alert_rule_test:
      - eval_time: 2m
        alertname: pytstop-circuito-aberto
        exp_alerts:
          - exp_labels: {namespace: pytstop-execucao, dependencia: billing}
      - eval_time: 6m
        alertname: pytstop-circuito-aberto
        exp_alerts: []
  # Uma abertura isolada de 30 s cai numa janela de 1 min so; a de 2 min a mostra em duas
  # avaliacoes seguidas, e e isso que deixa o `for` de 1 min disparar.
  - name: pytstop-circuito-aberto, uma unica abertura de 30 s da Execucao dispara e solta em 3 min
    interval: 15s
    input_series:
      - series: pytstop_circuit_breaker_aberto{namespace="pytstop-execucao", dependencia="billing", pod="exec-api-1"}
        values: "0.5 1 1 0.5x45"
    alert_rule_test:
      - eval_time: 1m
        alertname: pytstop-circuito-aberto
        exp_alerts: []
      - eval_time: 2m
        alertname: pytstop-circuito-aberto
        exp_alerts:
          - exp_labels: {namespace: pytstop-execucao, dependencia: billing}
      - eval_time: 3m
        alertname: pytstop-circuito-aberto
        exp_alerts: []
