# Promtail do compose: logs dos containers com o rotulo pytstop.logs=true
# (todos os servicos do docker-compose.yml, com qualquer nome de projeto) pela
# API do Docker. app = nome do servico no compose, para as mesmas consultas do
# cluster ({app="rabbitmq"} etc.).
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["pytstop.logs=true"]
    # Mesma mascara de token do Promtail do Kubernetes
    # (k8s/base/observabilidade/config/promtail.yaml).
    pipeline_stages:
      - replace:
          expression: '(?:/|%2[Ff])(?:publico(?:/|%2[Ff])orcamentos|simulador(?:/|%2[Ff])checkout)(?:/|%2[Ff])([^\s/?&"]+)'
          replace: "***"
      - replace:
          expression: 'token=([^\s&"]+)'
          replace: "***"
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: app
      - target_label: namespace
        replacement: compose
