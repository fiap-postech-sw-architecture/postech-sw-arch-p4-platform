[pytest]
# Config propria do E2E (make e2e: pytest -c e2e/pytest.ini e2e): sem o gate de
# cobertura da raiz, que mede o codigo auxiliar, e com os markers das tags do
# Gherkin declarados (--strict-markers reprova tag escrita errada).
# --capture=sys: o ::add-mask:: sai em sys.__stdout__, que a captura por fd (o padrao)
# esconderia do runner do GitHub Actions.
log_level = WARNING
addopts = --strict-markers --strict-config -p no:cacheprovider --capture=sys
markers =
    caminho-feliz: abertura ate a entrega, com trace e X-Request-ID (RF-028 a RF-037, RN-027, RNF-056)
    compensacao: falha de negocio desfaz os passos da saga (RN-024, RN-025, RN-026)
    estorno: cancelamento depois do pagamento estorna o valor (RN-023, RN-026)
    validacao: CPF invalido recusado e acompanhamento sem enumeracao (RF-028, RF-030)
    ponto-de-nao-retorno: cancelamento depois do inicio da execucao responde 409 (RN-029)
    expiracao: orcamento vencido cancela a OS (RN-024)
    resiliencia: consumidor ou API do Billing parados (RNF-034, RNF-055, RN-028)
    borda: Swagger de cada servico pelo Kong (ADR-038)
    demo: roteiro do video, rodado por make demo
    bloco-1: bloco 1 do video, o fluxo completo
    bloco-2: bloco 2 do video, as falhas
    mp_sandbox: Mercado Pago na sandbox, rodado so por make mp-sandbox e make mp-sandbox-ensaio (ADR-040)
    pagamento: pagamento pago no checkout do Mercado Pago e confirmado pela conciliacao (ADR-040)
    cobranca-aberta: cancelamento sem pagar fecha a cobranca e expira a preferencia (ADR-040)
# Avisos de descontinuacao que o pytest-bdd 8.1 e o gherkin-official 29 emitem (uso
# de APIs do pytest que saem no pytest 10 e de re.split com maxsplit posicional):
# divida registrada no MEMORY.md; ao subir essas libs, tirar o filtro.
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning
