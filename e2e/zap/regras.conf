# Regras do ZAP baseline na borda (scripts/ci/zap-baseline.sh, job e2e do cd.yml,
# ADR-041). Uma regra por linha: <id> TAB <FAIL|WARN|IGNORE|INFO> TAB <motivo>.
# FAIL reprova o job; WARN aparece no relatorio e no summary sem reprovar; IGNORE
# some do relatorio. Regra que nao esta aqui fica em WARN. Regra nova ignorada
# so entra com o motivo na linha e no PR (README, "ZAP baseline na borda").
#
# O alvo e o openapi.json de cada servico, que o Kong publica e o servico
# responde com os proprios cabecalhos de seguranca; as respostas que o proprio
# Kong gera (404 de rota inexistente, 429 do rate limit) nao passam por aqui.

# Swagger UI do FastAPI: o /docs carrega o JavaScript e o CSS do jsDelivr.
# Pagina de documentacao, sem dado nem credencial.
10017	IGNORE	Cross-Domain JavaScript Source File Inclusion: o Swagger UI vem do jsDelivr
90003	IGNORE	Sub Resource Integrity Attribute Missing: o mesmo script e o mesmo CSS do Swagger UI
10027	IGNORE	Information Disclosure - Suspicious Comments: comentarios do bundle de terceiro do Swagger UI
10110	IGNORE	Dangerous JS Functions: o bundle de terceiro do Swagger UI

# Informativos para uma API JSON: as datas sao do contrato, e o cache de uma
# resposta de API e decisao do servico (Cache-Control: no-store nos tres).
10096	IGNORE	Timestamp Disclosure - Unix: as datas das respostas sao do contrato
10109	IGNORE	Modern Web Application: informativo, nao e falha
10049	IGNORE	Storable and Cacheable Content: informativo para API JSON
10015	IGNORE	Re-examine Cache-control Directives: informativo para API JSON

# Versao da pilha nos cabecalhos: os servicos sobem sem o Server do uvicorn e o
# Kong sem Server, Via e X-Kong-* (headers=off no values.yaml, provado no make
# smoke). Qualquer um que volte reprova o job.
10036	FAIL	HTTP Server Response Header: nome e versao de produto no Server
10037	FAIL	Server Leaks Information via X-Powered-By

# Cabecalhos de seguranca: os servicos os poem em toda resposta deles, mas a
# resposta que o Kong gera sozinho sai sem eles. Vale FAIL assim que o
# relatorio mostrar que o achado e do servico, nao do Kong.
10020	WARN	Missing Anti-clickjacking Header
10021	WARN	X-Content-Type-Options Header Missing
10035	WARN	Strict-Transport-Security Header Not Set
10038	WARN	Content Security Policy (CSP) Header Not Set
