# Regras do ZAP baseline na borda (scripts/ci/zap-baseline.sh, job e2e do cd.yml,
# ADR-041). Uma regra por linha: <id> TAB <FAIL|WARN|IGNORE|INFO> TAB <motivo>.
# FAIL reprova o job; WARN aparece no relatorio e no summary sem reprovar; IGNORE
# some do relatorio. Regra que nao esta aqui fica em WARN. Regra ignorada so
# entra quando o relatorio mostrar o achado, com o motivo na linha e no PR
# (README, "ZAP baseline na borda").
#
# O alvo e o openapi.json de cada servico, que o servico responde com os
# proprios cabecalhos de seguranca. O spider pede tambem /, /<prefixo>,
# /robots.txt e /sitemap.xml, que nao sao rota de servico: o Kong os responde
# 404 sozinho, sem rota casada e sem plugin.

# Os servicos respondem Cache-Control: no-store, mas o JWKS responde public,
# max-age=600 de proposito (a chave publica muda pouco), e o alerta dispara nele.
10015	IGNORE	Re-examine Cache-control Directives: o JWKS responde public, max-age=600 de proposito

# Versao da pilha nos cabecalhos: os servicos sobem sem o Server do uvicorn e o
# Kong sem Server, Via e X-Kong-* (headers=off no values.yaml, provado no make
# smoke). Qualquer um que volte reprova o job.
10036	FAIL	HTTP Server Response Header: nome e versao de produto no Server
10037	FAIL	Server Leaks Information via X-Powered-By

# Cabecalhos de seguranca: os servicos os poem em toda resposta deles, e nenhum
# run os acusou, nem nos 404 do Kong. O HSTS e a excecao: o Kong sem rota
# casada nao o poe nos 404 que gera, e o 10035 fica em WARN enquanto o Kong
# nao mandar o cabecalho nessas respostas.
10020	FAIL	Missing Anti-clickjacking Header
10021	FAIL	X-Content-Type-Options Header Missing
10035	WARN	Strict-Transport-Security Header Not Set: os 404 que o Kong gera sozinho saem sem ele
10038	FAIL	Content Security Policy (CSP) Header Not Set
