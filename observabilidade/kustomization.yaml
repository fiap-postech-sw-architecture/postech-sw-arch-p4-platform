# Provisioning do Grafana. No Kubernetes estes arquivos viram ConfigMaps
# (k8s/base inclui este diretorio); o compose monta os mesmos arquivos.
# Hash no nome do ConfigMap: mudar um dashboard reinicia o pod do Grafana no
# proximo deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  labels:
    app: grafana

configMapGenerator:
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
  - name: grafana-dashboards-provider
    files:
      - grafana/dashboards.yaml
  # Os tres arquivos entram no mesmo diretorio de provisioning do Grafana. O
  # compose monta so alertas.yaml: os outros dependem do Kong, do relay e do
  # consumidor, que o compose nao tem. O overlay kind troca o
  # alertas-outbox-parada.yaml por uma copia com 30 s e 1 minuto (demonstracao).
  - name: grafana-alerting
    files:
      - grafana/alertas.yaml
      - grafana/alertas-cluster.yaml
      - grafana/alertas-outbox-parada.yaml
  # Um arquivo por dashboard. O `make manifests` (e o CI) reprova JSON de
  # dashboards/ que nao esteja nesta lista.
  - name: grafana-dashboards
    files:
      - dashboards/pytstop-plataforma.json
      - dashboards/pytstop-saga.json
      - dashboards/pytstop-mensageria.json
      - dashboards/pytstop-servicos.json
      - dashboards/pytstop-bancos.json
      - dashboards/pytstop-negocio-atendimento.json
      - dashboards/pytstop-negocio-orcamentos.json
      - dashboards/pytstop-negocio-pagamentos.json
      - dashboards/pytstop-negocio-execucao.json
